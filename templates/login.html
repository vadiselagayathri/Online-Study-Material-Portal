{% extends "base.html" %}
{% block title %}Login - StudyPortal{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <h1>Welcome Back</h1>
    <p class="auth-text">Login to access your study materials.</p>
    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" required placeholder="Enter your email">
      <label>Password</label>
      <input type="password" name="password" required placeholder="Enter your password">
      <button class="primary-btn full">Login</button>
    </form>
    <p class="bottom-text">Don't have an account? <a href="{{ url_for('signup') }}">Create Account</a></p>
  </div>
</div>
{% endblock %}
