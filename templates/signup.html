{% extends "base.html" %}
{% block title %}Signup - StudyPortal{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-icon">👨‍🎓</div>
    <h1>Create Account</h1>
    <p class="auth-text">Register as a student to access study materials.</p>
    <form method="POST" onsubmit="return validateSignup()">
      <label>Full Name</label>
      <input id="signupName" type="text" name="name" required placeholder="Enter your name">
      <label>Email</label>
      <input type="email" name="email" required placeholder="Enter your email">
      <label>Password</label>
      <input id="signupPassword" type="password" name="password" required placeholder="Minimum 6 characters">
      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" name="confirm_password" required placeholder="Confirm password">
      <button class="primary-btn full">Create Account</button>
    </form>
    <p class="bottom-text">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
